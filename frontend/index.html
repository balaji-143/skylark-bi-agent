<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Skylark Drones — BI Agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg:#0f172a; --panel:#111827; --accent:#38bdf8; --user:#1e293b; --bot:#0b3a4a; --text:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 760px; margin: 0 auto; height:100vh; display:flex; flex-direction:column; }
  header { padding: 18px 20px; border-bottom: 1px solid #1f2937; }
  header h1 { font-size: 16px; margin:0; }
  header p { margin: 4px 0 0; font-size: 12px; color:#94a3b8; }
  #log { flex:1; overflow-y:auto; padding: 16px 20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height:1.45; font-size:14px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--user); }
  .bot { align-self:flex-start; background:var(--bot); }
  .typing { align-self:flex-start; color:#94a3b8; font-size:13px; font-style:italic; }
  form { display:flex; gap:8px; padding: 14px 20px; border-top:1px solid #1f2937; }
  input { flex:1; background:#0b1220; border:1px solid #1f2937; color:var(--text); border-radius:8px; padding:10px 12px; font-size:14px; }
  button { background:var(--accent); border:none; color:#031018; font-weight:600; padding:10px 18px; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:0.5; cursor:default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Skylark Drones — BI Agent</h1>
    <p>Ask about pipeline, deals, work orders, or sector performance. Data is queried live from monday.com.</p>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="e.g. How's our pipeline looking for the energy sector this quarter?" />
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
let history = [];

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMessage('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  sendBtn.disabled = true;

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'Querying monday.com and thinking…';
  log.appendChild(typing);
  log.scrollTop = log.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ history })
    });
    const data = await res.json();
    typing.remove();
    if (!res.ok) {
      addMessage('bot', 'Error: ' + (data.detail || res.statusText));
      return;
    }
    addMessage('bot', data.reply);
    history.push({ role: 'assistant', content: data.reply });
  } catch (err) {
    typing.remove();
    addMessage('bot', 'Network error: ' + err.message);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
